# Shadowrocket | v2rayN bypass-mainland style | 2026-11-16
# Shadowrocket >= 2.2.92 recommended (direct-domain DNS routing).
# Closely follows v2rayN V4 whitelist goals; not identical to Xray/sing-box internals.
# DIRECT domain rules -> Tencent DoH; other local lookups -> Cloudflare DoH via proxy.
# Proxy destination domains usually resolve at the proxy server.
# Direct DNS failure may use the global fallback. Check real-device DNS logs.

[General]
dns-server = https://cloudflare-dns.com/dns-query#proxy
direct-dns-server = https://doh.pub/dns-query
fallback-dns-server = https://cloudflare-dns.com/dns-query#proxy
proxy-dns-server = https://doh.pub/dns-query
dns-fallback-system = false
dns-direct-system = false
dns-direct-fallback-proxy = false
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
udp-policy-not-supported-behaviour = REJECT
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true
update-url = https://raw.githubusercontent.com/XuanXiang007/shadowrocket-config/main/config-v2rayn-style-2026-11.ini

[Rule]
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Lan/Lan.list,DIRECT
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Google/Google.list,PROXY
DOMAIN-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/China/China_Domain.list,DIRECT
DOMAIN-SUFFIX,cn,DIRECT
GEOIP,CN,DIRECT,no-resolve
FINAL,PROXY
