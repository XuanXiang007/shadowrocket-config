[General]
# 代理流量阻断 QUIC
block-quic = all-proxy
# 基础 DNS：代理 DoH
dns-server = https://cloudflare-dns.com/dns-query#proxy
# 直连域名使用腾讯 DNS
direct-dns-server = 119.29.29.29
# 代理节点域名解析
proxy-dns-server = 119.29.29.29
# 备用 DNS：Google DoH
fallback-dns-server = https://dns.google/dns-query#proxy
# 禁用系统 DNS 回退
dns-fallback-system = false
# 直连域名不用系统 DNS
dns-direct-system = false
# 直连 DNS 失败不转代理
dns-direct-fallback-proxy = false
# 接管指定公共 DNS
hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 1.0.0.1:53
# 不支持 UDP 时拒绝
udp-policy-not-supported-behaviour = REJECT
# 禁用 IPv6
ipv6 = false
prefer-ipv6 = false
# 配置更新地址
update-url = https://raw.githubusercontent.com/XuanXiang007/shadowrocket-config/main/sr.ini

[Rule]
# 局域网直连
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list,DIRECT
# Google 代理
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Google/Google.list,PROXY
# 国内域名直连
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMaxNoIP/ChinaMaxNoIP_Domain.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMaxNoIP/ChinaMaxNoIP.list,DIRECT
# 中国 IP 直连，不主动解析
GEOIP,CN,DIRECT,no-resolve
# 其余流量代理
FINAL,PROXY
